<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23D9482B%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css"><title>Sign in · Nura</title></head>
<body><div class="shell">
  <aside class="aside">
    <div class="brand"><i></i>Nura</div>
    <div style="position:relative;z-index:1">
      <h1>Welcome <em>back.</em></h1><p>Sign in to see your profile, exactly as you left it.</p>
      <ul class="ledger" aria-label="How your data is stored">
        <li><span>MySQL</span><b>credentials</b></li>
        <li><span>MongoDB</span><b>profile</b></li>
        <li><span>Redis</span><b>session · 24h</b></li>
      </ul>
    </div>
    <span></span>
  </aside>
  <main class="main"><div class="panel">
    <p class="eyebrow">Sign in</p>
    <h2>Good to see you.</h2>
    <p class="lede">Use the email you registered with.</p>
    <div id="alert" class="alert" aria-live="polite"></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="reveal" data-for="password" aria-pressed="false">Show</button></div>
      <button id="submit" class="btn" type="submit"><span class="spin"></span>Sign in</button>
    </form>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
  </div></main>
</div><script type="module" src="js/login.js"></script></body></html>

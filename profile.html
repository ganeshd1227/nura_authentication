<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23D9482B%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css"><title>Your profile · Nura</title></head>
<body>
<header class="top"><div class="brand"><i></i>Nura</div><button id="logoutBtn" class="btn ghost" type="button">Sign out</button></header>
<div class="page">
  <aside class="id-card" aria-label="Account summary">
    <div class="avatar skeleton" id="avatar">·</div>
    <h3 id="displayName" class="skeleton">Loading name</h3>
    <div class="handle skeleton" id="handle">@loading</div>
    <div class="kv"><small>Email</small><span id="email" class="skeleton">loading@example.com</span></div>
    <div class="kv"><small>Member since</small><span id="since" class="skeleton">January 1, 2026</span></div>
    <div class="kv"><small>Age</small><span id="ageView">—</span></div>
    <div class="kv"><small>Bio</small><span id="bioView">—</span></div>
    <div class="kv" id="interestsBlock" hidden><small>Interests</small><div class="tags" id="interestTags"></div></div>
  </aside>
  <main class="editor">
    <p class="eyebrow">Profile</p>
    <h2>Edit your details</h2>
    <p class="lede">Saved to your MongoDB profile document.</p>
    <div id="alert" class="alert" aria-live="polite"></div>
    <form id="profileForm" novalidate>
      <div class="row2">
        <div class="field"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
        <div class="field"><label for="age">Age</label><input id="age" type="number" min="13" max="120"></div>
      </div>
      <div class="field"><label for="bio">Bio</label><textarea id="bio" rows="3"></textarea></div>
      <div class="field"><label for="interests">Interests</label><input id="interests" placeholder="music, hiking, chess"><div class="hint">Comma-separated.</div></div>
      <button id="submit" class="btn" type="submit"><span class="spin"></span>Save changes</button>
    </form>
  </main>
</div>
<script type="module" src="js/profile.js"></script></body></html>
